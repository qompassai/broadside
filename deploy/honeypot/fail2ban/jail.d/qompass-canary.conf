# fail2ban jail: qompass.ai canary endpoints (HONEYPOT.md H4).
#
# Ships DISABLED. Applying it is an Owner act on the host:
#   1. Fill in ignoreip with the Owner's own addresses and the
#      known-good scanners FIRST (allowlist-first is the rule;
#      an empty allowlist here is a deliberate Owner statement,
#      never a default broadside chose).
#   2. Copy to /etc/fail2ban/jail.d/qompass-canary.conf
#   3. Flip enabled to true and reload fail2ban.
#
# Trigger discipline: one completed request to a decoy endpoint
# (maxretry = 1). Ban decays after 30 days (bantime), matching
# the broadside feed's decay window.
[qompass-canary]
enabled  = false
filter   = qompass-canary
logpath  = /var/log/caddy/qompass.ai.log
backend  = auto
maxretry = 1
findtime = 10m
bantime  = 30d
# ignoreip = 127.0.0.1/8 ::1 <OWNER ADDRESSES — FILL IN BEFORE ENABLING>
action   = iptables-multiport[name=qompass-canary, port="http,https", protocol=tcp]
