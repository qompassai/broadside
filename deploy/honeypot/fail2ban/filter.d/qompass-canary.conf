# fail2ban filter: qompass.ai canary endpoints (HONEYPOT.md H4).
#
# Matches a COMPLETED HTTP request to a decoy endpoint in the
# Caddy JSON access log (/var/log/caddy/qompass.ai.log). The
# decoy set mirrors the signed honeypot manifest's paths plus
# the standard probe paths H1 names. A hit is hostile by
# construction: the paths are never linked, never in the
# sitemap, and are Disallow'd in robots.txt.
#
# Install (Owner, on the host): copy to
# /etc/fail2ban/filter.d/qompass-canary.conf
[Definition]
failregex = "request": \{[^}]*"uri": "/(\.env|\.git/.*|wp-login\.php|wp-admin/.*|admin/.*|backup\.zip|config\.php|phpmyadmin/.*)"
ignoreregex =
